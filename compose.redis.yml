name: quality-platform-local

services:
  redis:
    image: redis:8.2.11-alpine
    ports:
      - "127.0.0.1:${REDIS_LOCAL_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-local-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

volumes:
  redis-local-data:
